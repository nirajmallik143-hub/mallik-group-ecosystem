<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Humanity Nepal AI</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white p-4 max-w-2xl mx-auto space-y-3">
<header class="flex justify-between items-center border-b border-slate-800 pb-3"><div><h1 class="font-bold text-emerald-400">Humanity Nepal AI (मानवता नेपाल AI)</h1><p class="text-xs text-slate-400">Mallik Group • Node 01 • MIT License</p></div><button onclick="document.getElementById('sos').classList.toggle('hidden')" class="bg-red-600 px-3 py-1.5 rounded text-xs font-bold">SOS</button></header>
<div><input id="apiKey" type="password" placeholder="Paste Gemini API Key (AIzaSy...) here" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-xs"></div>
<div class="grid grid-cols-2 gap-2"><select id="lang" class="bg-slate-900 border border-slate-700 p-2 rounded text-sm">{% for l in languages %}<option>{{l}}</option>{% endfor %}</select><select id="dom" class="bg-slate-900 border border-slate-700 p-2 rounded text-sm"><option>Education</option><option>Civic & Governance</option><option>Agriculture</option><option>Public Health</option></select></div>
<textarea id="pr" rows="3" placeholder="Ask in Nepali, Maithili, Bhojpuri, Newari, Tamang, Tharu, Limbu, English..." class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm"></textarea>
<button id="runBtn" onclick="run()" class="w-full bg-emerald-600 py-2 rounded font-bold text-sm">Execute Plan → Act → Verify → Deliver</button>
<div id="out" class="hidden space-y-2 text-xs bg-slate-900 p-3 rounded border border-slate-800"></div>
<div id="sos" class="hidden bg-red-950/50 border border-red-700 p-3 rounded space-y-2"><h2 class="font-bold text-red-400 text-sm">SOS Emergency Triage</h2><input id="loc" placeholder="Ward / District" class="w-full bg-slate-900 p-2 rounded text-xs"><textarea id="al" rows="2" placeholder="Emergency details..." class="w-full bg-slate-900 p-2 rounded text-xs"></textarea><button onclick="sendSos()" class="w-full bg-red-600 py-1.5 rounded font-bold text-xs">DISPATCH SOS</button><div id="sout" class="text-xs"></div></div>
<script>
apiKey.value=localStorage.getItem('gemini_key')||'';
async function run(){localStorage.setItem('gemini_key',apiKey.value);runBtn.textContent='Reasoning...';const r=await fetch("/v1/reason",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:pr.value,language:lang.value,domain:dom.value,api_key:apiKey.value})});const d=await r.json();runBtn.textContent='Execute Plan → Act → Verify → Deliver';out.classList.remove("hidden");if(d.error){out.innerHTML=`<b>Error:</b> ${d.error}`;return;}out.innerHTML=`<b>1. PLAN:</b> ${d.plan}<br><b>2. ACT:</b> ${d.act}<br><b>3. VERIFY:</b> ${d.verify}<br><b>4. DELIVER:</b> ${d.deliver}<hr class="my-2 border-slate-700"><b>CANVAS (${d.canvas_title}):</b><pre class="whitespace-pre-wrap mt-1 text-emerald-300">${d.canvas_content}</pre>`;}
async function sendSos(){localStorage.setItem('gemini_key',apiKey.value);const r=await fetch("/v1/sos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({alert:al.value,location:loc.value,language:lang.value,api_key:apiKey.value})});const d=await r.json();if(d.error){sout.innerHTML=`<b>Error:</b> ${d.error}`;return;}sout.innerHTML=`<b>${d.severity}:</b> ${d.guidance_local}<br><i>${d.broadcast_bulletin}</i>`;}
</script><div style="text-align:center;font-size:12px;opacity:0.75;padding:8px;">©Nirajmallik@hub</div>
</body></html>
